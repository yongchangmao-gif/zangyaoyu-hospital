<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>资金收支分析周报</title>
<style>
  :root{
    --paper:#eef1f6;
    --panel:#ffffff;
    --ink:#12233c;
    --ink-soft:#28405c;
    --muted:#5c7086;
    --line:#d8e0ea;
    --line-soft:#e7ecf2;
    --gold:#b9862f;
    --gold-soft:#f1e2bf;
    --teal:#1f6f5c;
    --teal-soft:#c7e2da;
    --plum:#5b4b8a;
    --plum-soft:#dcd5ee;
    --maroon:#8a3324;
    --maroon-soft:#f2d9d1;
    --sage:#357a56;
    --shadow:0 2px 12px rgba(18,35,60,.09);
    --shadow-sm:0 1px 4px rgba(18,35,60,.08);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:"Noto Serif SC","Songti SC","STSong",serif}
  ::selection{background:var(--gold-soft)}

  .shell{max-width:1180px;margin:0 auto;padding:32px 28px 70px}

  .masthead{padding:6px 4px 24px}
  .mast-eyebrow{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:10px}
  .masthead h1{font-size:29px;margin:0 0 4px;font-weight:800;letter-spacing:.3px}
  .masthead .sub{font-size:13.5px;color:var(--muted)}

  .period-tabs{display:flex;gap:10px;margin:24px 0 26px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
  .period-tab{
    appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
    font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;padding:10px 22px;border-radius:999px;
    box-shadow:var(--shadow-sm);transition:all .15s ease;letter-spacing:.02em;
  }
  .period-tab .rng{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
  .period-tab.active{background:var(--gold);border-color:var(--gold);color:#fff}
  .period-tab.active .rng{color:#fff9ec}
  .period-tab:not(.active):hover{border-color:var(--gold);color:var(--gold)}

  #renderA{animation:fadein .22s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){#renderA{animation:none}}

  .rp-hero{text-align:center;padding:8px 0 6px;margin-bottom:8px}
  .rp-hero .chop{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;border:2px solid var(--maroon);color:var(--maroon);
    font-weight:800;font-size:14px;transform:rotate(-6deg);margin-right:8px;font-family:"Noto Serif SC",serif;
  }
  .rp-hero .pill{display:inline-flex;align-items:center;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:7px 18px;border-radius:999px;letter-spacing:.03em}
  .rp-hero .range{color:var(--muted);font-size:13px;margin-top:10px}

  .rp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0 30px}
  .rp-kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px 20px 18px}
  .rp-kpi .lbl{font-size:13.5px;color:var(--muted);margin-bottom:10px;font-weight:600}
  .rp-kpi .val{font-size:27px;font-weight:800;font-family:"Noto Serif SC",serif;color:var(--ink)}
  .rp-kpi .val.pos{color:var(--sage)}.rp-kpi .val.neg{color:var(--maroon)}
  .rp-kpi .note{font-size:12.5px;color:var(--muted);margin-top:8px}
  .rp-kpi .note.neg{color:var(--maroon)}.rp-kpi .note.pos{color:var(--sage)}

  .rp-section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:26px 26px 28px;margin-bottom:22px}
  .rp-section-title{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800;padding-bottom:15px;border-bottom:1px solid var(--line-soft);margin-bottom:22px;font-family:"Noto Serif SC",serif}
  .rp-badge{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--maroon);color:var(--maroon);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:0 0 auto;transform:rotate(-4deg);font-family:"Noto Serif SC",serif}
  .rp-section-title .unit{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
  .rp-subhead{font-size:14.5px;color:var(--ink-soft);font-weight:800;border-left:3px solid var(--gold);padding-left:9px;margin:0 0 16px}
  .rp-subhead.income{border-color:var(--sage);color:var(--sage)}
  .rp-subhead.expense{border-color:var(--maroon);color:var(--maroon)}

  .rp-composition{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:8px}
  .rp-donut-card{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .rp-donut{width:148px;height:148px;border-radius:50%;position:relative;flex:0 0 auto}
  .rp-donut:after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
  .rp-donut-center{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;text-align:center}
  .rp-donut-center span{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
  .rp-legend{display:grid;gap:11px;font-size:14px;min-width:170px}
  .rp-legend-row{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
  .rp-legend-row .name{color:var(--ink-soft)}
  .rp-legend-row .amt{font-weight:800;text-align:right;white-space:nowrap}
  .swatch{width:11px;height:11px;border-radius:3px}
  .rp-note-line{font-size:12.5px;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}

  .rp-change-list{display:grid;gap:18px}
  .rp-change-row{display:grid;grid-template-columns:64px 1fr 90px 100px;gap:14px;align-items:center}
  .rp-change-row.total{border-top:1px solid var(--line-soft);padding-top:16px;margin-top:2px}
  .rp-change-name{font-weight:800;font-size:14.5px;text-align:right;color:var(--ink-soft)}
  .rp-pair{display:grid;gap:4px}
  .rp-meter{height:20px;border-radius:6px;display:flex;align-items:center;padding:0 9px;color:#fff;font-size:11.5px;font-weight:800}
  .rp-meter.last{background:#c7d0dd;color:#3a4a60}
  .rp-trend{text-align:right;color:var(--muted);font-size:13.5px}
  .rp-delta{text-align:right;font-size:13.5px;font-weight:800}
  .rp-delta.neg{color:var(--maroon)}.rp-delta.pos{color:var(--sage)}.rp-delta.flat{color:var(--muted)}

  .rp-flow-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
  .rp-flow-card{border-radius:12px;border:1px solid var(--line);padding:18px 20px;border-left:4px solid}
  .rp-flow-card.income{border-left-color:var(--sage)}
  .rp-flow-card.expense{border-left-color:var(--maroon)}
  .rp-flow-card .t{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
  .rp-flow-card .n{font-size:22px;font-weight:800;margin-bottom:10px}
  .rp-flow-card .n.income{color:var(--sage)}.rp-flow-card .n.expense{color:var(--maroon)}
  .rp-flow-items{display:grid;gap:5px}
  .rp-flow-items div{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;border-bottom:1px dashed var(--line-soft)}
  .rp-flow-items div:last-child{border-bottom:none}
  .rp-flow-items b{color:var(--ink-soft);font-weight:700}

  .rp-compare{margin-bottom:6px}
  .rp-compare-row{display:flex;align-items:center;gap:12px;margin:9px 0}
  .rp-compare-track{flex:1;height:22px;background:#eef2f8;border-radius:6px;overflow:hidden}
  .rp-compare-bar{height:100%;border-radius:6px}
  .rp-compare-label{font-size:13px;font-weight:800;white-space:nowrap;min-width:130px;text-align:right}

  .rp-block-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .rp-block{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .rp-block-head{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14.5px;border-bottom:1px solid var(--line)}
  .rp-block-head .pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px}
  .rp-block-head .pill.bad{background:var(--maroon-soft);color:var(--maroon)}
  .rp-block-head .pill.good{background:#dcefe3;color:var(--sage)}
  .rp-block-body{padding:13px 15px}
  .rp-block-kpi{display:grid;grid-template-columns:1fr 1fr;margin-bottom:10px;font-size:12px}
  .rp-block-kpi .v{font-size:15.5px;font-weight:800;margin-top:2px}
  .rp-mini-cap{font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 2px;font-weight:700}
  .rp-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px dotted var(--line-soft)}
  .rp-line:last-child{border-bottom:none}
  .rp-line b{color:var(--ink-soft);font-weight:700}
  .rp-empty-note{font-size:12px;color:#a3adbd;margin-bottom:8px}

  .rp-us-banner{background:linear-gradient(100deg,var(--plum),#382a63);color:#fff;border-radius:12px;padding:14px 22px;font-weight:800;font-size:15px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
  .rp-us-banner .flag{font-size:12px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:5px;letter-spacing:.05em}
  .rp-section.us{border-left:5px solid var(--plum);background:#fbfaff}
  .rp-section.us .rp-badge{border-color:var(--plum);color:var(--plum)}
  .rp-us-detail{border:1px solid var(--plum-soft);border-radius:12px;padding:16px 18px;font-size:13.5px}
  .rp-us-detail .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft);color:var(--muted)}
  .rp-us-detail .row:last-child{border-bottom:none}
  .rp-us-detail .row b{color:var(--ink)}
  .rp-us-detail .row.neg b{color:var(--maroon)}
  .rp-us-ref{margin-top:12px;background:#f4f1fb;border-radius:8px;padding:10px 12px;font-size:12px;color:var(--muted)}

  .rp-findings{display:grid;gap:13px}
  .rp-finding{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:flex-start;background:#f7f9fc;border-radius:10px;border-left:4px solid var(--muted);padding:16px 18px;font-size:14px;line-height:1.7;color:var(--ink-soft)}
  .rp-finding.warn{border-left-color:var(--gold)}
  .rp-finding.alert{border-left-color:var(--maroon)}
  .rp-finding.good{border-left-color:var(--sage)}
  .rp-finding .chip{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;background:var(--muted)}
  .rp-finding.warn .chip{background:var(--gold)}
  .rp-finding.alert .chip{background:var(--maroon)}
  .rp-finding.good .chip{background:var(--sage)}
  .rp-finding b{color:var(--ink)}

  .footer{text-align:center;color:#93a2b8;font-size:12.5px;padding-top:24px}

  @media (max-width:1080px){
    .rp-kpis,.rp-block-grid{grid-template-columns:repeat(2,1fr)}
    .rp-composition,.rp-flow-grid{grid-template-columns:1fr}
    .shell{padding:22px 16px 50px}
  }
  @media (max-width:640px){
    .rp-kpis,.rp-block-grid{grid-template-columns:1fr}
    .rp-change-row{grid-template-columns:52px 1fr}
    .rp-trend,.rp-delta{grid-column:2;text-align:left}
    .masthead h1{font-size:23px}
  }
  @media print{body{background:#fff}.rp-section,.rp-kpi{box-shadow:none;break-inside:avoid}}
</style>
</head>

/* ================= 工具函数 ================= */
function fmt(n, d=2){
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:d, maximumFractionDigits:d});
  return (neg?'-':'') + s;
}
function fmtSigned(n, d=2){ return (n>=0?'+':'') + fmt(n,d); }
function fmtUSD(n, d=2){
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
  return (neg?'-$':'$') + s;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function deltaClass(n){ return n>0?'pos':(n<0?'neg':'flat'); }
function trendArrow(n){ return n>0?'↑':(n<0?'↓':'→'); }

function donutGradient(segments){
  let acc = 0; const parts = [];
  segments.forEach(seg=>{
    const start = acc; acc += seg.pct;
    parts.push(`${seg.color} ${start.toFixed(2)}% ${acc.toFixed(2)}%`);
  });
  return `conic-gradient(${parts.join(', ')})`;
}

/* ================= 报表主体渲染（方案 A / C 共用） ================= */
function renderKPIs(d){
  return `
  <div class="rp-kpis">

    <div class="rp-kpi"><div class="lbl">收入合计（不含内部往来）</div><div class="val pos">${fmt(d.income)} 万</div><div class="note">经营性回款</div></div>
    <div class="rp-kpi"><div class="lbl">支出合计（不含内部往来）</div><div class="val neg">${fmt(d.expense)} 万</div><div class="note">经营类支出</div></div>
    <div class="rp-kpi"><div class="lbl">净现金流入</div><div class="val ${d.netFlow<0?'neg':'pos'}">${fmtSigned(d.netFlow)} 万</div><div class="note ${d.netFlow<0?'neg':'pos'}">${d.netFlow<0?'净流出':'净流入'}</div></div>
  </div>`;
}

function renderComposition(d){
  const own = d.composition.own, loan = d.composition.loan;
  const ownPct = d.composition.ownPct, loanPct = d.composition.loanPct;
  const donut1 = donutGradient([{pct:ownPct,color:'var(--teal)'},{pct:loanPct,color:'var(--gold)'}]);
  const blockSegs = d.blocks.map(b=>({pct:b.pct, color:BLOCK_COLOR[b.name]||'var(--muted)'}));
  const donut2 = donutGradient(blockSegs);
  return `
  <div class="rp-composition">
    <div>
      <div class="rp-subhead">资金性质构成</div>
      <div class="rp-donut-card">
        <div class="rp-donut" style="background:${donut1}"><div class="rp-donut-center">${fmt(d.balance,0)}<span>万元</span></div></div>
        <div class="rp-legend">
          <div class="rp-legend-row"><span class="swatch" style="background:var(--teal)"></span><span class="name">自有资金</span><span class="amt">${fmt(own)} 万</span></div>
          <div class="rp-legend-row"><span class="swatch" style="background:var(--gold)"></span><span class="name">贷款资金</span><span class="amt">${fmt(loan)} 万</span></div>
          <div class="rp-legend-row" style="color:var(--muted);font-size:12.5px"><span></span><span>自有占比</span><span class="amt">${ownPct}%</span></div>
        </div>
      </div>
    </div>
    <div>
      <div class="rp-subhead">各板块余额分布</div>
      <div class="rp-donut-card">
        <div class="rp-donut" style="background:${donut2}"><div class="rp-donut-center">${fmt(d.balance,0)}<span>万元</span></div></div>
        <div class="rp-legend">
          ${d.blocks.map(b=>`<div class="rp-legend-row"><span class="swatch" style="background:${BLOCK_COLOR[b.name]}"></span><span class="name">${b.name}</span><span class="amt">${fmt(b.amount)} 万</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>
  <div class="rp-note-line">注：原"集团"板块已按确认口径统一显示为"阿如拉"（同一板块更名，非新增板块）。</div>`;
}

function renderChange(d){
  const rows = d.blockChange.map(b=>{
    const rowMax = Math.max(b.last, b.current, 0.01);
    const lastW = (b.last/rowMax*100).toFixed(1);
    const curW = (b.current/rowMax*100).toFixed(1);
    return `
    <div class="rp-change-row">
      <div class="rp-change-name">${b.name}</div>
      <div class="rp-pair">
        <div class="rp-meter last" style="width:${lastW}%">${fmt(b.last)}</div>
        <div class="rp-meter" style="width:${curW}%;background:${BLOCK_COLOR[b.name]}">${fmt(b.current)}</div>
      </div>
      <div class="rp-trend">${trendArrow(b.delta)}${Math.abs(b.deltaPct).toFixed(2)}%</div>
      <div class="rp-delta ${deltaClass(b.delta)}">${fmtSigned(b.delta)}</div>
    </div>`;
  }).join('');
  const t = d.changeTotal;
  const rowMaxT = Math.max(t.last, t.current);
  return `
  <div class="rp-change-list">
    ${rows}
    <div class="rp-change-row total">
      <div class="rp-change-name">合计</div>
      <div class="rp-pair">
        <div class="rp-meter last" style="width:100%">${fmt(t.last)}</div>
        <div class="rp-meter" style="width:${(t.current/rowMaxT*100).toFixed(1)}%;background:var(--ink)">${fmt(t.current)}</div>
      </div>
      <div class="rp-trend">${trendArrow(t.delta)}${Math.abs(t.deltaPct).toFixed(2)}%</div>
      <div class="rp-delta ${deltaClass(t.delta)}">${fmtSigned(t.delta)}</div>
    </div>
  </div>`;
}

function renderFlows(d){
  const maxV = Math.max(d.income, d.expense, 0.01);
  return `
  <div class="rp-flow-grid">
    <div class="rp-flow-card income">
      <div class="t">收入合计</div><div class="n income">${fmt(d.income)} 万元</div>
      <div class="rp-flow-items">${d.incomeDetail.map(x=>`<div><span>${x.item}</span><b>${fmt(x.total)}</b></div>`).join('')}</div>
    </div>
    <div class="rp-flow-card expense">
      <div class="t">支出合计</div><div class="n expense">${fmt(d.expense)} 万元</div>
      <div class="rp-flow-items">${d.expenseDetail.map(x=>`<div><span>${x.item}</span><b>${fmt(x.total)}</b></div>`).join('')}</div>
    </div>
  </div>
  <div class="rp-compare">
    <div class="rp-subhead">收支对比</div>
    <div class="rp-compare-row"><div class="rp-compare-track"><div class="rp-compare-bar" style="width:${(d.income/maxV*100).toFixed(1)}%;background:var(--teal)"></div></div><div class="rp-compare-label">收入 ${fmt(d.income)}</div></div>
    <div class="rp-compare-row"><div class="rp-compare-track"><div class="rp-compare-bar" style="width:${(d.expense/maxV*100).toFixed(1)}%;background:var(--maroon)"></div></div><div class="rp-compare-label">支出 ${fmt(d.expense)}</div></div>
  </div>`;
}

function renderBlockDetail(d){
  return `
  <div class="rp-block-grid">
    ${d.blockDetail.map(b=>`
    <div class="rp-block">
      <div class="rp-block-head" style="background:${BLOCK_COLOR[b.name]}18">
        <span>${b.name}</span>
        <span class="pill ${b.net<0?'bad':'good'}">净额 ${fmtSigned(b.net)}</span>
      </div>
      <div class="rp-block-body">
        <div class="rp-block-kpi">
          <div><div style="color:var(--muted)">收入</div><div class="v" style="color:var(--sage)">${fmt(b.income)}</div></div>
          <div><div style="color:var(--muted)">支出</div><div class="v" style="color:var(--maroon)">${fmt(b.expense)}</div></div>
        </div>
        ${b.incomeItems.length? `<div class="rp-mini-cap">收入明细</div>${b.incomeItems.map(x=>`<div class="rp-line"><span>${x.l}</span><b>${fmt(x.v)}</b></div>`).join('')}` : `<div class="rp-empty-note">无外部收入</div>`}
        <div class="rp-mini-cap">支出明细</div>
        ${b.expenseItems.map(x=>`<div class="rp-line"><span>${x.l}</span><b>${fmt(x.v)}</b></div>`).join('')}
      </div>
    </div>`).join('')}
  </div>`;
}

function renderUS(us){
  const compHtml = us.composition ? `
    <div class="rp-donut-card" style="margin-top:14px">
      <div class="rp-donut" style="background:${donutGradient([{pct:us.composition.ownPct,color:'var(--plum)'},{pct:us.composition.loanPct,color:'var(--plum-soft)'}])}"><div class="rp-donut-center">${fmtUSD(us.balance,0)}<span>USD</span></div></div>
      <div class="rp-legend">
        <div class="rp-legend-row"><span class="swatch" style="background:var(--plum)"></span><span class="name">自有资金</span><span class="amt">${fmtUSD(us.composition.own,0)}</span></div>
        <div class="rp-legend-row"><span class="swatch" style="background:var(--plum-soft)"></span><span class="name">贷款资金</span><span class="amt">${fmtUSD(us.composition.loan,0)}</span></div>
      </div>
    </div>` : '';
  return `
  <div class="rp-us-banner"><span class="flag">US</span> 美国公司资金分析 · 单位 USD $</div>
  <div class="rp-kpis" style="grid-template-columns:repeat(4,1fr)">
    <div class="rp-kpi"><div class="lbl">本周余额</div><div class="val" style="color:var(--plum)">${fmtUSD(us.balance)}</div><div class="note ${us.balanceDelta<0?'neg':'pos'}">${trendArrow(us.balanceDelta)} ${fmtSigned(us.balanceDeltaPct)}%</div></div>
    <div class="rp-kpi"><div class="lbl">本周收入</div><div class="val pos">${fmtUSD(us.income)}</div><div class="note">${us.income===0?'本周无收入':''}</div></div>
    <div class="rp-kpi"><div class="lbl">本周支出</div><div class="val neg">${fmtUSD(us.expense)}</div></div>
    <div class="rp-kpi"><div class="lbl">净现金流入</div><div class="val neg">${fmtUSD(us.netFlow)}</div><div class="note neg">净流出</div></div>
  </div>
  <div class="rp-composition" style="margin-top:18px">
    <div>${us.composition? `<div class="rp-subhead">资金性质构成</div>${compHtml}`:''}</div>
    <div>
      <div class="rp-subhead">收支明细</div>
      <div class="rp-us-detail">
        ${us.incomeItems.length? us.incomeItems.map(x=>`<div class="row"><span>${x.l}</span><b>${fmtUSD(x.v)}</b></div>`).join('') : `<div class="row"><span>收入项</span><b>本周无收入</b></div>`}
        ${us.expenseItems.map(x=>`<div class="row neg"><span>${x.l}</span><b>${fmtUSD(x.v)}</b></div>`).join('')}
        <div class="row neg"><span>净现金流入</span><b>${fmtUSD(us.netFlow)}</b></div>
        ${us.reference? `<div class="rp-us-ref">其他参考数据：${esc(us.reference)}</div>`:''}
      </div>
    </div>
  </div>`;
}

function renderFindings(findings){
  return `
  <div class="rp-findings">
    ${findings.map(f=>`
    <div class="rp-finding ${f.tone}">
      <div class="chip">${f.tag? esc(f.tag) : '●'}</div>
      <div>${f.text}</div>
    </div>`).join('')}
  </div>`;
}

function generateReportBody(period){
  const w = weekData[period];
  const d = w.domestic;
  return `
  <div class="rp-hero">
    <span class="chop">${period.slice(-2)}</span><span class="pill display">${w.label}</span>
    ${w.rangeNote? `<div class="range">报告周期：${w.rangeNote}</div>`:''}
  </div>

  <div class="rp-section-title" style="border:none;margin-bottom:6px;padding-bottom:0"><span class="rp-badge">概</span>国内公司 · 资金概况 <span class="unit">单位：${d.unit}</span></div>
  ${renderKPIs(d)}

  <div class="rp-section">
    <div class="rp-section-title"><span class="rp-badge">1</span>资金构成与各板块余额分布</div>
    ${renderComposition(d)}
  </div>

  <div class="rp-section">
    <div class="rp-section-title"><span class="rp-badge">2</span>各板块资金变动（环比上期）</div>
    ${renderChange(d)}
  </div>

  <div class="rp-section">
    <div class="rp-section-title"><span class="rp-badge">3</span>收支分析</div>
    ${renderFlows(d)}
  </div>

  <div class="rp-section">
    <div class="rp-section-title"><span class="rp-badge">4</span>分板块收支明细</div>
    ${renderBlockDetail(d)}
  </div>

  <div class="rp-section us">
    <div class="rp-section-title"><span class="rp-badge">5</span>美国公司资金分析</div>
    ${renderUS(w.us)}
  </div>

  <div class="rp-section">
    <div class="rp-section-title"><span class="rp-badge">6</span>关键发现 / 分析总结</div>
    ${renderFindings(w.findings)}
  </div>
  `;
}

/* ================= 趋势总览（方案 C） ================= */

/* ================= 交互逻辑（单周，无需切换） ================= */
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('renderA').innerHTML = generateReportBody('2026-08-21');
});

</script>
</body>
</html>
